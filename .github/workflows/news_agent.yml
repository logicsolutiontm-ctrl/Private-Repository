name: Telegram News Agent

on:
  schedule:
    # يعمل تلقائياً كل ساعة (عند الدقيقة 0)
    - cron: '0 * * * *'
  workflow_dispatch: # يتيح لك زراً لتشغيله يدوياً متى شئت

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save database changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_news.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent articles db" && git pull --rebase origin main && git push)
