name: News Bot

on:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة
  workflow_dispatch:          # تشغيل يدوي

permissions:
  contents: write             # لازم لحفظ قاعدة البيانات في المستودع

concurrency:
  group: news-bot
  cancel-in-progress: false   # لا يبدأ تشغيل جديد قبل انتهاء السابق

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run bot
        run: python -u bot.py
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRIEND_CHAT_ID: ${{ secrets.FRIEND_CHAT_ID }}

      - name: Save sent news
        if: always()          # يحفظ حتى لو توقف البوت في منتصف التشغيل
        run: |
          [ -f sent_news.db ] || { echo "No database to save."; exit 0; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # نسخة هذا التشغيل (فيها الأخبار الجديدة)
          cp sent_news.db /tmp/ours.db

          for i in 1 2 3 4 5; do
            # ابدأ دائماً من آخر نسخة في المستودع (بدون دمج Git للملف الثنائي)
            git fetch origin "$GITHUB_REF_NAME"
            rm -f sent_news.db
            git reset --hard "origin/$GITHUB_REF_NAME"

            # ادمج محتوى النسختين داخل قاعدة البيانات
            python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("sent_news.db")
          conn.execute("CREATE TABLE IF NOT EXISTS articles (id TEXT PRIMARY KEY)")
          conn.execute("ATTACH DATABASE '/tmp/ours.db' AS ours")
          conn.execute("INSERT OR IGNORE INTO articles (id) SELECT id FROM ours.articles")
          conn.commit()
          conn.close()
          PY

            git add sent_news.db
            if git diff --cached --quiet; then
              echo "No changes to save."
              exit 0
            fi

            git commit -m "Update sent news database [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Saved successfully."
              exit 0
            fi

            echo "Push failed (attempt $i), retrying..."
            sleep $((i * 3))
          done

          echo "Could not save sent_news.db after 5 attempts."
          exit 1
